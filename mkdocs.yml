site_name: ShotMatic Reports
site_description: Real app-market data from ShotMatic — keyword ranks, trends and app hunts, one screenshot at a time.
site_url: https://nvminhtu.github.io/shotmatic-reports/
repo_url: https://github.com/nvminhtu/shotmatic-reports
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font:
    text: Figtree
    code: JetBrains Mono
  logo: images/shotmatic-wordmark-light.png
  favicon: images/shotmatic-favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
plugins:
  - search
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
# BEGIN NAV (generated by scripts/new_post.py — do not edit by hand)
nav:
  - Home: index.md
  - Keyword:
      - keyword/index.md
      - "Nov 23 · Speaker cleaner ranks": keyword/2026-11-23-speaker-cleaner-keyword-ranks.md
  - ASO:
      - aso/index.md
      - "Nov 23 · Colorfy ASO audit": aso/2026-11-23-colorfy-coloring-book-aso-audit.md
# END NAV
